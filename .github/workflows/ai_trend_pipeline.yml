name: AI Design Trend Radar Pipeline

on:
  # Runs everyday at 9:00 AM and 6:00 PM Pakistan Time (PKT, UTC+5) -> 04:00 and 13:00 UTC
  schedule:
    - cron: '0 4,13 * * *'
  # Allows on-demand manual trigger from the GitHub Actions tab anytime
  workflow_dispatch:
  # Optional: runs when pipeline scripts are updated
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ai_trend_pipeline.yml'
      - '.github/scripts/**'

# Set permissions for committing updated data and publishing to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pipeline-and-pages"
  cancel-in-progress: false

jobs:
  discover-verify-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🛰️ Run AI Discovery & Verification Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/ai_pipeline.py

      - name: 💾 Commit and Push Verified Trends to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.js data.json
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping commit."
          else
            git commit -m "chore(radar-ai): Auto-ingest verified design trends [9am/6pm PKT cycle] [skip ci]"
            git push origin main
          fi

      - name: 🌐 Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: 📦 Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
